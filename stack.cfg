# nextendo-testing stack configuration (LAN).
#
# HOST   the address consoles reach this PC on. "auto" picks the Windows Mobile Hotspot
#        address (192.168.137.1) if present, else the first private IPv4 of this PC.
# HOST2  a second address on this PC for nncs: Pia games (MK8, Splatoon...) check NAT against two
#        addresses. Empty = 127.0.0.1, so nncs runs but that second check fails on consoles.
HOST=192.168.137.1
HOST2=192.168.137.2

# Game servers to start (names from games/). Each needs a config/<name>.env.
# All of them (sni-router routes the console only to the games in its route table). Demonware:
# diablo-3-nx (Diablo III) or crash-team-racing (CTR + D3), not both: they share ports and hosts.
GAMES=diablo-3-nx,ssbu,acnh,mario-kart-8-deluxe,super-mario-maker-2,borderlands-1-nx,torchlight-2-nx,advance-wars-nx,splatoon-2,splatoon-3,splatoon-3-gamesync,minecraft,mario-strikers,luigis-mansion-3,arms,clubhouse-games-51,mario-golf-super-rush,mario-party-superstars,mario-tennis-aces,monster-hunter-generations-ultimate,super-mario-bros-35,super-mario-odyssey,super-mario-3d-world,metal-gear-solid-peacewalker

# Services, started in this order (sni-router last: it owns :443 and forwards to the rest).
SERVICES=nnaccount-nx,tls-front,conntest,account,baas-jwks,dauth,scsi,nncs,dashboard,bcat-nx,tagaya-nx,telemetry-nx,eos-nx,gamespy-nx,sni-router
